<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
<title>Container Detail</title>

<style>
  @font-face {
    font-family: 'Geist';
    src: url('./fonts/Geist[wght].woff2') format('woff2-variations');
    font-weight: 100 900;
    font-display: swap;
  }
  @font-face {
    font-family: 'Geist Mono';
    src: url('./fonts/GeistMono[wght].woff2') format('woff2-variations');
    font-weight: 100 900;
    font-display: swap;
  }

  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-2: #f0efe9;
    --border: #e2e0d8;
    --border-strong: #c8c5ba;
    --text-primary: #1a1917;
    --text-secondary: #6b6860;
    --text-muted: #6b6860;
    --accent: #2563eb;
    --accent-soft: #dbeafe;
    --green: #16a34a;
    --green-soft: #dcfce7;
    --amber: #d97706;
    --amber-soft: #fef3c7;
    --violet: #7c3aed;
    --violet-soft: #ede9fe;
    --tag-bg: #eeecea;
    --tag-text: #44423d;
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12), 0 4px 8px rgba(0,0,0,0.06);
    --radius: 8px;
    --radius-sm: 5px;
    --radius-lg: 12px;
    --font: 'Geist', sans-serif;
    --font-mono: 'Geist Mono', monospace;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #32323f;
      --surface: #1c1b19;
      --surface-2: #242320;
      --border: #2e2c28;
      --border-strong: #3d3b35;
      --text-primary: #f0ede8;
      --text-secondary: #9c9a94;
      --text-muted: #9c9a94;
      --accent: #3b82f6;
      --accent-soft: #1e3a5f;
      --green: #22c55e;
      --green-soft: #14291f;
      --amber: #f59e0b;
      --amber-soft: #2d2008;
      --violet: #a78bfa;
      --violet-soft: #2e1065;
      --tag-bg: #2a2926;
      --tag-text: #b8b5ae;
      --shadow-md: 0 4px 12px rgba(0,0,0,0.4), 0 2px 4px rgba(0,0,0,0.2);
      --shadow-lg: 0 8px 24px rgba(0,0,0,0.5), 0 4px 8px rgba(0,0,0,0.3);
    }
    .subdomain-display { color: #e5e7eb; }
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 16px;
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 80vh;
    gap: 12px;
    color: var(--text-muted);
  }
  .empty-state svg { opacity: 0.3; }
  .empty-state p { font-size: 13px; font-family: var(--font-mono); letter-spacing: 0.02em; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
    overflow: visible;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* -- Header -- */
  .card-header {
    padding: 20px 24px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-2);
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  }

  .header-titles {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .container-name-display {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    cursor: pointer;
    padding: 2px 4px;
    margin-left: -4px;
    border-radius: var(--radius-sm);
    transition: background 0.15s;
  }
  .container-name-display:hover { background: var(--border); }

  .inline-input {
    font-family: var(--font-mono);
    font-size: 18px;
    font-weight: 600;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 3px 8px;
    outline: none;
    width: 100%;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
  }

  .subdomain-display {
    font-family: var(--font-mono);
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    padding: 2px 4px;
    margin-left: -4px;
    margin-top: 2px;
    border-radius: var(--radius-sm);
    transition: background 0.15s;
    color: #4b5563;
  }
  .subdomain-display:hover { background: var(--border); }

  .subdomain-edit-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 8px;
  }

  .subdomain-input {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-primary);
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 3px 8px;
    outline: none;
    width: 200px;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
  }

  .btn-xs {
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 3px 8px;
    border-radius: var(--radius-sm);
    border: none;
    cursor: pointer;
    font-weight: 500;
    transition: opacity 0.15s;
  }
  .btn-xs:hover { opacity: 0.8; }
  .btn-save   { background: var(--accent); color: #fff; }
  .btn-cancel { background: var(--surface-2); color: var(--text-secondary); border: 1px solid var(--border); }

  /* -- Badges -- */
  .badge-grid {
    padding: 14px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: var(--font-mono);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.15s;
  }
  .badge-icon { font-size: 10px; font-weight: bold; width: 10px; display: inline-block; }
  .badge:active { transform: scale(0.95); }
  .badge.on {
    background: var(--green-soft);
    color: var(--green);
    border-color: color-mix(in srgb, var(--green) 20%, transparent);
  }
  .badge.on:hover { background: color-mix(in srgb, var(--green) 20%, transparent); }
  .badge.off {
    background: var(--surface-2);
    color: var(--text-muted);
    border-color: var(--border);
    opacity: 0.65;
  }
  .badge.off:hover { opacity: 1; color: var(--text-secondary); }

  /* -- Body -- */
  .card-body {
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field {
    display: grid;
    grid-template-columns: 120px 1fr;
    gap: 8px 16px;
    align-items: start;
  }

  .field-label {
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font-mono);
    color: var(--text-primary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding-top: 4px;
  }

  .field-value { color: var(--text-primary); font-size: 13.5px; }
  .field-empty { color: var(--text-muted); font-style: italic; font-size: 13.5px; }

  /* -- Tags -- */
  .tag-list { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; position: relative; }

  .tag {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-family: var(--font-mono);
    border: 1px solid var(--border);
    background: var(--tag-bg);
    color: var(--tag-text);
  }
  .tag.network { border-color: color-mix(in srgb, var(--accent) 25%, transparent); background: var(--accent-soft); color: var(--accent); }
  .tag.dep     { border-color: color-mix(in srgb, var(--amber)  25%, transparent); background: var(--amber-soft);  color: var(--amber); }
  .tag.port    { border-color: color-mix(in srgb, var(--violet) 25%, transparent); background: var(--violet-soft); color: var(--violet); }

  .tag-remove {
    cursor: pointer;
    opacity: 0.5;
    font-size: 14px;
    line-height: 1;
    transition: opacity 0.15s;
    margin-left: 2px;
  }
  .tag-remove:hover { opacity: 1; }

  .tag-add-btn {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--text-muted);
    border: 1px dashed var(--border-strong);
    cursor: pointer;
    background: none;
    transition: all 0.15s;
  }
  .tag-add-btn:hover { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  /* -- Dropdown -- */
  .dropdown-anchor { position: relative; display: inline-block; }

  .dropdown-menu {
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 1000;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    min-width: 180px;
    max-height: 220px;
    overflow-y: auto;
    padding: 4px;
  }

  .dropdown-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    font-family: var(--font-mono);
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.1s;
  }
  .dropdown-item:hover { background: var(--surface-2); }
  .check { width: 14px; font-size: 11px; color: var(--green); flex-shrink: 0; }

  /* -- Notes -- */
  .notes-display {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    white-space: pre-wrap;
    cursor: pointer;
    min-height: 40px;
    word-break: break-word;
    opacity: 0.65;
    transition: opacity 0.15s, border-color 0.15s;
  }
  .notes-display:hover { opacity: 1; border-color: var(--border-strong); }
  .notes-display.empty { color: var(--text-muted); font-style: italic; }

  .notes-textarea {
    width: 100%;
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius-sm);
    padding: 10px 12px;
    font-size: 13px;
    font-family: var(--font);
    color: var(--text-primary);
    line-height: 1.6;
    resize: vertical;
    min-height: 80px;
    outline: none;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent);
  }

  .notes-actions { display: flex; gap: 6px; margin-top: 6px; justify-content: flex-end; }

  .divider { height: 1px; background: var(--border); margin: 0 -24px; }

  /* -- Toast -- */
  .toast {
    position: fixed;
    bottom: 16px;
    right: 16px;
    background: var(--text-primary);
    color: var(--bg);
    padding: 8px 14px;
    border-radius: var(--radius);
    font-size: 12px;
    font-family: var(--font-mono);
    box-shadow: var(--shadow-md);
    animation: toastIn 0.2s ease;
    z-index: 9999;
  }
  @keyframes toastIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media screen and (max-width: 600px) {
    html, body {
      width: 100vw !important;
      height: auto !important;
      min-height: 100% !important;
      margin: 0;
      padding: 0;
      display: block !important;
    }
    .card {
      width: calc(100% - 20px) !important;
      min-width: 320px !important;
      min-height: 500px !important;
      margin: 10px auto !important;
      box-sizing: border-box;
    }
    .badge, .subdomain-display, .container-name-display { padding: 10px 8px; }
  }
</style>
</head>
<body>
<div id="app">
  <div class="empty-state">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <rect x="2" y="3" width="20" height="14" rx="2"/>
      <path d="M8 21h8M12 17v4"/>
    </svg>
    <p>select a container to view details</p>
  </div>
</div>

<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<script>
  // ---------------------------------------------------------------------
  // Table IDs (verified against Raw Data -> stable regardless of display
  // titles). If you ever rename a table's display title in Grist, these
  // do NOT need to change -- only update them here if you change the
  // actual Table ID itself (Raw Data page).
  // ---------------------------------------------------------------------
  const TABLE_CONTAINERS = 'Containers';
  const TABLE_NETWORKS   = 'Networks';
  const TABLE_STACKS     = 'Compose_Stacks';
  const TABLE_PORTS      = 'Ports';

  // Column ids within each of those tables, used for the lookup tables
  // built from grist.docApi.fetchTable() (these calls are NOT covered by
  // the grist.ready() column-mapping feature below, since that only
  // applies to the primary bound table).
  const COL_NETWORK_NAME = 'Network';
  const COL_STACK_NAME   = 'Stack';
  const COL_CONTAINER_NAME = 'Container';
  const COL_PORT_CONTAINER = 'Container';
  const COL_PORT_MAPPING   = 'Mapping';

  const AUTHELIA_CHOICES = ['Full', 'Regex', 'None'];

  // Badge definitions for the Containers table. 'bool' badges are simple
  // click-to-toggle. 'choice' badges (just Authelia Bypass right now)
  // open a single-select dropdown instead.
  const BADGE_DEFS = [
    { type: 'bool',   key: 'Compose',        label: 'Compose Stack' },
    { type: 'choice', key: 'Authelia_Bypass', label: 'Authelia Bypass', choices: AUTHELIA_CHOICES, offValues: [null, undefined, '', 'None'] },
    { type: 'bool',   key: 'Auto_Update',     label: 'Auto-Update' },
    { type: 'bool',   key: 'Proxy_Conf',      label: 'Proxy-Conf' },
    { type: 'bool',   key: 'Auto_Start',      label: 'Auto-Start' },
    { type: 'bool',   key: 'Cloudflared',     label: 'Cloudflare' },
    { type: 'bool',   key: 'OIDC',            label: 'OIDC' },
  ];

  let currentRecord  = null;
  let currentRowId   = null;

  // id -> display name lookup maps, refreshed on every onRecord.
  let networkMap   = {};
  let stackMap     = {};
  let containerMap = {};
  let portsData    = []; // [{ id, Container, Mapping }]

  let activeDropdown = null;

  // -- Helpers --------------------------------------------------------------

  function esc(str) {
    const d = document.createElement('div');
    d.textContent = String(str ?? '');
    return d.innerHTML;
  }

  function getVal(record, key) {
    return record ? record[key] : undefined;
  }

  // Reference List cell values arrive as ['L', id1, id2, ...] by default
  // (non-typed) custom-widget format. Reference (single) values arrive as
  // a plain row-id number (or 0/null when unset).
  function parseRefList(val) {
    if (!val) return [];
    if (Array.isArray(val)) {
      const arr = val[0] === 'L' ? val.slice(1) : val;
      return arr.filter(v => v !== null && v !== undefined);
    }
    return [];
  }

  function encodeRefList(ids) { return ['L', ...ids]; }

  function showToast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2000);
  }

  async function saveField(colId, value) {
    if (!currentRowId) return;
    try {
      await grist.getTable().update({ id: currentRowId, fields: { [colId]: value } });
    } catch (e) {
      showToast('Save failed: ' + e.message);
    }
  }

  document.addEventListener('click', () => closeDropdown());

  function closeDropdown() {
    if (activeDropdown) { activeDropdown.remove(); activeDropdown = null; }
  }

  // -- Lookup tables (Networks / Stacks / Containers / Ports) ----------------

  function buildIdMap(tableData, nameCol) {
    const map = {};
    const ids = tableData.id || [];
    const names = tableData[nameCol] || [];
    ids.forEach((id, i) => { map[id] = names[i]; });
    return map;
  }

  async function refreshLookups() {
    try {
      const [nets, stacks, containers, ports] = await Promise.all([
        grist.docApi.fetchTable(TABLE_NETWORKS),
        grist.docApi.fetchTable(TABLE_STACKS),
        grist.docApi.fetchTable(TABLE_CONTAINERS),
        grist.docApi.fetchTable(TABLE_PORTS),
      ]);
      networkMap   = buildIdMap(nets, COL_NETWORK_NAME);
      stackMap     = buildIdMap(stacks, COL_STACK_NAME);
      containerMap = buildIdMap(containers, COL_CONTAINER_NAME);

      const portIds = ports.id || [];
      portsData = portIds.map((id, i) => ({
        id,
        Container: ports[COL_PORT_CONTAINER] ? ports[COL_PORT_CONTAINER][i] : null,
        Mapping: ports[COL_PORT_MAPPING] ? ports[COL_PORT_MAPPING][i] : null,
      }));
    } catch (e) {
      console.error('[widget] Failed to refresh lookups:', e);
      showToast('Could not sync lookup tables');
    }
  }

  // -- Generic dropdown -------------------------------------------------------
  // items: [{ label, selected, onClick }]

  function openDropdown(anchorEl, items, emptyText) {
    closeDropdown();

    const menu = document.createElement('div');
    menu.className = 'dropdown-menu';

    if (!items.length) {
      const empty = document.createElement('div');
      empty.className = 'dropdown-item';
      empty.style.cssText = 'color:var(--text-muted);font-style:italic;cursor:default';
      empty.textContent = emptyText || 'No options available';
      menu.appendChild(empty);
    }

    items.forEach(({ label, selected, onClick }) => {
      const item = document.createElement('div');
      item.className = 'dropdown-item';

      const check = document.createElement('span');
      check.className = 'check';
      check.textContent = selected ? '✓' : '';

      const lbl = document.createElement('span');
      lbl.textContent = label;

      item.appendChild(check);
      item.appendChild(lbl);

      item.addEventListener('click', async (e) => {
        e.stopPropagation();
        closeDropdown();
        await onClick();
      });
      menu.appendChild(item);
    });

    const anchor = document.createElement('div');
    anchor.className = 'dropdown-anchor';
    anchorEl.parentNode.insertBefore(anchor, anchorEl);
    anchor.appendChild(anchorEl);
    anchor.appendChild(menu);
    activeDropdown = menu;
  }

  // -- Render -----------------------------------------------------------------

  function renderEmpty() {
    document.getElementById('app').innerHTML = `
      <div class="empty-state">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
        <p>select a container to view details</p>
      </div>`;
  }

  function renderCard(record) {
    const name       = getVal(record, 'Container') ?? '—';
    const subdomain  = getVal(record, 'Subdomain') ?? '';
    const stackId    = getVal(record, 'Stack') || null;
    const networkIds = parseRefList(getVal(record, 'Networks'));
    const depIds     = parseRefList(getVal(record, 'Dependencies'));
    const notes      = getVal(record, 'Notes') ?? '';
    const portMappings = portsData
      .filter(p => p.Container === currentRowId)
      .map(p => p.Mapping)
      .filter(Boolean);

    const app = document.getElementById('app');
    app.innerHTML = '';

    const card = document.createElement('div');
    card.className = 'card';

    // -- Header --
    const header = document.createElement('div');
    header.className = 'card-header';

    const titleGroup = document.createElement('div');
    titleGroup.className = 'header-titles';

    const nameEl = document.createElement('div');
    nameEl.className = 'container-name-display';
    nameEl.textContent = name;
    nameEl.addEventListener('click', () => startEditName(nameEl, name));
    titleGroup.appendChild(nameEl);

    const stackLabel = stackId ? (stackMap[stackId] || `#${stackId}`) : 'Unraid Template';
    const stackEl = document.createElement('div');
    stackEl.className = 'subdomain-display';
    stackEl.textContent = `Stack: ${stackLabel}`;
    stackEl.addEventListener('click', (e) => { e.stopPropagation(); openStackPicker(stackEl, stackId); });
    titleGroup.appendChild(stackEl);

    const subEl = document.createElement('div');
    subEl.className = 'subdomain-display subdomain-line';
    subEl.textContent = `Subdomain: ${subdomain || 'none'}`;
    subEl.addEventListener('click', () => startEditSubdomain(header, subdomain));
    titleGroup.appendChild(subEl);

    header.appendChild(titleGroup);
    card.appendChild(header);

    // -- Body --
    const body = document.createElement('div');
    body.className = 'card-body';

    body.appendChild(makeRefListField('Networks', 'Networks', 'network', networkIds, networkMap, null));
    body.appendChild(makeDivider());

    body.appendChild(makePortsField(portMappings));
    body.appendChild(makeDivider());

    body.appendChild(makeRefListField('Dependencies', 'Dependencies', 'dep', depIds, containerMap, currentRowId));
    body.appendChild(makeDivider());

    const badgeGrid = document.createElement('div');
    badgeGrid.className = 'badge-grid';
    BADGE_DEFS.forEach(def => badgeGrid.appendChild(makeBadge(def, record)));
    body.appendChild(badgeGrid);
    body.appendChild(makeDivider());

    body.appendChild(makeNotesField(notes));

    card.appendChild(body);
    app.appendChild(card);
  }

  function makeDivider() {
    const d = document.createElement('div');
    d.className = 'divider';
    return d;
  }

  function makeBadge(def, record) {
    if (def.type === 'bool') {
      const val = getVal(record, def.key);
      const on = val === true || val === 1 || val === 'true';
      const badge = document.createElement('span');
      badge.className = `badge ${on ? 'on' : 'off'}`;
      badge.innerHTML = `${on ? '<span class="badge-icon">✓</span>' : ''}${esc(def.label)}`;
      badge.addEventListener('click', async (e) => {
        e.stopPropagation();
        await saveField(def.key, !on);
      });
      return badge;
    }

    // choice-type badge (Authelia Bypass)
    const val = getVal(record, def.key);
    const on = val && !def.offValues.includes(val);
    const badge = document.createElement('span');
    badge.className = `badge ${on ? 'on' : 'off'}`;
    const text = on ? `${def.label}: ${val}` : def.label;
    badge.innerHTML = `${on ? '<span class="badge-icon">✓</span>' : ''}${esc(text)}`;
    badge.addEventListener('click', (e) => {
      e.stopPropagation();
      const items = def.choices.map(choice => ({
        label: choice,
        selected: choice === val,
        onClick: async () => { await saveField(def.key, choice); },
      }));
      openDropdown(badge, items);
    });
    return badge;
  }

  function makeRefListField(label, colKey, tagClass, currentIds, idToNameMap, excludeId) {
    const field = document.createElement('div');
    field.className = 'field';

    const lbl = document.createElement('span');
    lbl.className = 'field-label';
    lbl.textContent = label;
    field.appendChild(lbl);

    const valWrap = document.createElement('div');
    valWrap.className = 'field-value';

    const tagList = document.createElement('div');
    tagList.className = 'tag-list';

    currentIds.forEach(id => {
      const displayName = idToNameMap[id] ?? `#${id}`;
      const tag = document.createElement('span');
      tag.className = `tag ${tagClass}`;

      const txt = document.createElement('span');
      txt.textContent = displayName;

      const rm = document.createElement('span');
      rm.className = 'tag-remove';
      rm.textContent = '×';
      rm.title = 'Remove';
      rm.addEventListener('click', async (e) => {
        e.stopPropagation();
        await saveField(colKey, encodeRefList(currentIds.filter(x => x !== id)));
      });

      tag.appendChild(txt);
      tag.appendChild(rm);
      tagList.appendChild(tag);
    });

    const addBtn = document.createElement('button');
    addBtn.className = 'tag-add-btn';
    addBtn.innerHTML = `<svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 5v14M5 12h14"/></svg> Add`;
    addBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const items = Object.entries(idToNameMap)
        .filter(([id]) => (excludeId === null || excludeId === undefined) || Number(id) !== excludeId)
        .map(([id, displayName]) => {
          const idNum = Number(id);
          const selected = currentIds.includes(idNum);
          return {
            label: displayName,
            selected,
            onClick: async () => {
              const next = selected ? currentIds.filter(v => v !== idNum) : [...currentIds, idNum];
              await saveField(colKey, encodeRefList(next));
            },
          };
        });
      openDropdown(addBtn, items, 'No options available');
    });
    tagList.appendChild(addBtn);

    valWrap.appendChild(tagList);
    field.appendChild(valWrap);
    return field;
  }

  function makePortsField(mappings) {
    const field = document.createElement('div');
    field.className = 'field';

    const lbl = document.createElement('span');
    lbl.className = 'field-label';
    lbl.textContent = 'Ports';
    field.appendChild(lbl);

    const valWrap = document.createElement('div');
    valWrap.className = 'field-value';

    if (!mappings.length) {
      const empty = document.createElement('span');
      empty.className = 'field-empty';
      empty.textContent = 'No ports mapped';
      valWrap.appendChild(empty);
    } else {
      const tagList = document.createElement('div');
      tagList.className = 'tag-list';
      mappings.forEach(m => {
        const tag = document.createElement('span');
        tag.className = 'tag port';
        tag.textContent = m;
        tagList.appendChild(tag);
      });
      valWrap.appendChild(tagList);
    }

    field.appendChild(valWrap);
    return field;
  }

  function makeNotesField(notes) {
    const field = document.createElement('div');
    field.className = 'field';

    const lbl = document.createElement('span');
    lbl.className = 'field-label';
    lbl.textContent = 'Notes';
    field.appendChild(lbl);

    const valWrap = document.createElement('div');
    valWrap.className = 'field-value';

    const display = document.createElement('div');
    display.className = 'notes-display' + (notes ? '' : ' empty');
    display.textContent = notes || 'Click to add notes…';
    display.addEventListener('click', () => startEditNotes(valWrap, notes));

    valWrap.appendChild(display);
    field.appendChild(valWrap);
    return field;
  }

  // -- Inline editors -----------------------------------------------------------

  function startEditName(el, current) {
    const input = document.createElement('input');
    input.className = 'inline-input';
    input.value = current;
    el.replaceWith(input);
    input.focus(); input.select();

    async function commit() {
      const v = input.value.trim();
      if (v && v !== current) await saveField('Container', v);
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter')  { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { input.value = current; input.blur(); }
    });
  }

  function startEditSubdomain(headerEl, current) {
    const existing = headerEl.querySelector('.subdomain-line');
    if (existing) existing.remove();

    const row = document.createElement('div');
    row.className = 'subdomain-edit-row';

    const input = document.createElement('input');
    input.className = 'subdomain-input';
    input.value = current;
    input.placeholder = 'e.g. myapp.example.com';

    const save = document.createElement('button');
    save.className = 'btn-xs btn-save';
    save.textContent = 'Save';

    const cancel = document.createElement('button');
    cancel.className = 'btn-xs btn-cancel';
    cancel.textContent = 'Cancel';

    row.appendChild(input); row.appendChild(save); row.appendChild(cancel);
    headerEl.appendChild(row);
    input.focus();

    async function commit() { await saveField('Subdomain', input.value.trim()); }
    save.addEventListener('click', commit);
    cancel.addEventListener('click', () => renderCard(currentRecord));
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter')  commit();
      if (e.key === 'Escape') renderCard(currentRecord);
    });
  }

  function startEditNotes(container, current) {
    container.innerHTML = '';

    const textarea = document.createElement('textarea');
    textarea.className = 'notes-textarea';
    textarea.value = current;

    const actions = document.createElement('div');
    actions.className = 'notes-actions';

    const cancel = document.createElement('button');
    cancel.className = 'btn-xs btn-cancel';
    cancel.textContent = 'Cancel';

    const save = document.createElement('button');
    save.className = 'btn-xs btn-save';
    save.textContent = 'Save';

    actions.appendChild(cancel);
    actions.appendChild(save);
    container.appendChild(textarea);
    container.appendChild(actions);
    textarea.focus();

    save.addEventListener('click', async () => { await saveField('Notes', textarea.value); });
    cancel.addEventListener('click', () => renderCard(currentRecord));
    textarea.addEventListener('keydown', e => {
      if (e.key === 'Escape') renderCard(currentRecord);
    });
  }

  function openStackPicker(el, currentStackId) {
    const items = [
      {
        label: '— None (Unraid Template) —',
        selected: !currentStackId,
        onClick: async () => { await saveField('Stack', null); },
      },
      ...Object.entries(stackMap).map(([id, displayName]) => ({
        label: displayName,
        selected: Number(id) === currentStackId,
        onClick: async () => { await saveField('Stack', Number(id)); },
      })),
    ];
    openDropdown(el, items, 'No stacks defined yet');
  }

  // -- Grist wiring ---------------------------------------------------------
  // The 'name' values below are set to match the verified real column ids
  // in Containers, so Grist should auto-map them on first load. If you
  // later rename a column's actual Column ID (not just its label), open
  // this widget's config panel in Grist and remap manually -- no code
  // change needed.

  grist.ready({
    requiredAccess: 'full',
    columns: [
      { name: 'Container',        title: 'Container',        type: 'Text' },
      { name: 'Subdomain',        title: 'Subdomain',        type: 'Text',     optional: true },
      { name: 'Networks',         title: 'Networks',         type: 'RefList' },
      { name: 'Dependencies',     title: 'Dependencies',     type: 'RefList',  optional: true },
      { name: 'Stack',            title: 'Stack',             type: 'Ref',      optional: true },
      { name: 'Notes',            title: 'Notes',             type: 'Text',     optional: true },
      { name: 'Compose',          title: 'Compose',           type: 'Bool,Int', optional: true },
      { name: 'Authelia_Bypass',  title: 'Authelia Bypass',   type: 'Choice',   optional: true },
      { name: 'Auto_Update',      title: 'Auto-Update',       type: 'Bool,Int', optional: true },
      { name: 'Proxy_Conf',       title: 'Proxy-Conf',        type: 'Bool,Int', optional: true },
      { name: 'Auto_Start',       title: 'Auto-Start',        type: 'Bool,Int', optional: true },
      { name: 'Cloudflared',      title: 'Cloudflare',        type: 'Bool,Int', optional: true },
      { name: 'OIDC',             title: 'OIDC',               type: 'Bool,Int', optional: true },
    ],
  });

  grist.onRecord(async (record) => {
    currentRecord = record;
    currentRowId = record?.id ?? null;

    if (!record || !record.id) {
      renderEmpty();
      return;
    }

    await refreshLookups();
    renderCard(record);
  });

  grist.onNewRecord(() => {
    currentRecord = null;
    currentRowId  = null;
    renderEmpty();
  });
</script>
</body>
</html>
